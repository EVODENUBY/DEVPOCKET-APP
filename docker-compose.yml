services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devpocket
      POSTGRES_USER: devpocket
      POSTGRES_PASSWORD: devpocket
    ports:
      - '5433:5432'
    volumes:
      - devpocket-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devpocket -d devpocket']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devpocket-postgres:
